<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 340" width="100%" height="100%">
  <defs>
    <linearGradient id="pipeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="geminiGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="successGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <rect width="920" height="340" rx="14" fill="url(#pipeBg)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Title -->
  <text x="36" y="38" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700">ScoreIQ: Alternative Credit Evaluation Pipeline</text>
  <text x="36" y="58" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Transforming raw banking transactions into transparent creditworthiness scores (300 - 900) for unbanked gig workers &amp; new earners.</text>

  <!-- ==================================================================== -->
  <!-- STEP 1: INPUT DATA -->
  <!-- ==================================================================== -->
  <g transform="translate(36, 85)">
    <rect width="180" height="215" rx="8" fill="url(#cardGrad1)" stroke="#334155" stroke-width="1"/>
    <rect width="180" height="4" rx="2" fill="#3b82f6"/>
    <text x="14" y="24" fill="#60a5fa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">STEP 1: INGESTION</text>
    <text x="14" y="44" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Financial Records</text>

    <rect x="14" y="58" width="152" height="44" rx="4" fill="#1e293b" stroke="#475569" stroke-width="0.5"/>
    <text x="24" y="76" fill="#e2e8f0" font-family="monospace" font-size="10">Internal Ledger</text>
    <text x="24" y="92" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9">Passbook transactions</text>

    <rect x="14" y="110" width="152" height="44" rx="4" fill="#1e293b" stroke="#475569" stroke-width="0.5"/>
    <text x="24" y="128" fill="#e2e8f0" font-family="monospace" font-size="10">External Bank CSV</text>
    <text x="24" y="144" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9">Uploaded 30-90 day statement</text>

    <rect x="14" y="162" width="152" height="40" rx="4" fill="#1e293b" stroke="#475569" stroke-width="0.5"/>
    <text x="24" y="179" fill="#e2e8f0" font-family="monospace" font-size="10">Manual Metrics</text>
    <text x="24" y="193" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9">User inputted cashflow</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <g transform="translate(224, 185)">
    <line x1="0" y1="0" x2="24" y2="0" stroke="#60a5fa" stroke-width="2"/>
    <polygon points="22,-4 28,0 22,4" fill="#60a5fa"/>
  </g>

  <!-- ==================================================================== -->
  <!-- STEP 2: FEATURE EXTRACTION -->
  <!-- ==================================================================== -->
  <g transform="translate(256, 85)">
    <rect width="190" height="215" rx="8" fill="url(#cardGrad1)" stroke="#334155" stroke-width="1"/>
    <rect width="190" height="4" rx="2" fill="#10b981"/>
    <text x="14" y="24" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">STEP 2: EXTRACTION</text>
    <text x="14" y="44" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Behavioral Signals</text>

    <!-- Signal 1 -->
    <text x="14" y="70" fill="#38bdf8" font-family="monospace" font-size="10.5">Inflows vs Outflows</text>
    <text x="14" y="85" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">Operating margin &amp; burn rate</text>

    <!-- Signal 2 -->
    <text x="14" y="112" fill="#38bdf8" font-family="monospace" font-size="10.5">Deposit Regularity</text>
    <text x="14" y="127" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">Swiggy/Zomato/Salary tags</text>

    <!-- Signal 3 -->
    <text x="14" y="154" fill="#38bdf8" font-family="monospace" font-size="10.5">UPI Digital Footprint</text>
    <text x="14" y="169" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">Frequency of cashless payments</text>

    <!-- Signal 4 -->
    <text x="14" y="196" fill="#f43f5e" font-family="monospace" font-size="10.5">Dishonors &amp; Bounces</text>
    <text x="14" y="211" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">ECS returns, penalty debits</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <g transform="translate(454, 185)">
    <line x1="0" y1="0" x2="24" y2="0" stroke="#10b981" stroke-width="2"/>
    <polygon points="22,-4 28,0 22,4" fill="#10b981"/>
  </g>

  <!-- ==================================================================== -->
  <!-- STEP 3: DUAL UNDERWRITING ENGINE -->
  <!-- ==================================================================== -->
  <g transform="translate(486, 85)">
    <rect width="200" height="215" rx="8" fill="url(#cardGrad1)" stroke="#334155" stroke-width="1"/>
    <rect width="200" height="4" rx="2" fill="url(#geminiGrad)"/>
    <text x="14" y="24" fill="#a78bfa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">STEP 3: EVALUATION</text>
    <text x="14" y="44" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Dual Analysis Engine</text>

    <!-- Engine Option A: Gemini LLM -->
    <rect x="12" y="60" width="176" height="66" rx="6" fill="#1e293b" stroke="#818cf8" stroke-width="1"/>
    <text x="22" y="78" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700">Google Gemini 3.5 AI</text>
    <text x="22" y="94" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5">Prompt-driven LLM parsing</text>
    <text x="22" y="108" fill="#94a3b8" font-family="monospace" font-size="9">Structured JSON schema output</text>

    <!-- Engine Option B: Deterministic Java / JS -->
    <rect x="12" y="136" width="176" height="66" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="22" y="154" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700">Deterministic Engine</text>
    <text x="22" y="170" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5">4 Weighted Pillars (25% each)</text>
    <text x="22" y="184" fill="#94a3b8" font-family="monospace" font-size="9">ScoreIQ.java rule engine</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <g transform="translate(694, 185)">
    <line x1="0" y1="0" x2="24" y2="0" stroke="#818cf8" stroke-width="2"/>
    <polygon points="22,-4 28,0 22,4" fill="#818cf8"/>
  </g>

  <!-- ==================================================================== -->
  <!-- STEP 4: FINAL DECISION -->
  <!-- ==================================================================== -->
  <g transform="translate(726, 85)">
    <rect width="160" height="215" rx="8" fill="url(#cardGrad1)" stroke="#334155" stroke-width="1"/>
    <rect width="160" height="4" rx="2" fill="url(#successGrad)"/>
    <text x="14" y="24" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">STEP 4: DECISION</text>
    <text x="14" y="44" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Credit Verdict</text>

    <!-- Score Box -->
    <rect x="12" y="58" width="136" height="48" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
    <text x="24" y="78" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="800">300 - 900</text>
    <text x="24" y="94" fill="#64748b" font-family="monospace" font-size="9">ALTERNATIVE SCORE</text>

    <text x="14" y="124" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5">Rating Band:</text>
    <text x="14" y="139" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600">EXCELLENT / POOR</text>

    <text x="14" y="162" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5">Default Probability:</text>
    <text x="14" y="177" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600">4.5% to 78.5%</text>

    <text x="14" y="200" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5">Eligible Credit Limit:</text>
    <text x="14" y="215" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="700">₹0 to ₹1,50,000</text>
  </g>
</svg>