<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" width="100%" height="100%">
  <defs>
    <linearGradient id="layerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
    <linearGradient id="headerGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="headerGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="headerGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="headerGrad4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="920" height="480" rx="14" fill="#0b0f19" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Title & Description Header -->
  <text x="40" y="42" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700">Tally System Architecture &amp; Layered Design</text>
  <text x="40" y="64" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Decoupled 4-tier structure demonstrating pure Java Object-Oriented separation of concerns.</text>

  <!-- ==================================================================== -->
  <!-- TIER 1: PRESENTATION LAYER -->
  <!-- ==================================================================== -->
  <g transform="translate(40, 90)">
    <rect width="840" height="74" rx="8" fill="url(#layerGrad)" stroke="#334155" stroke-width="1"/>
    <rect width="840" height="6" rx="3" fill="url(#headerGrad1)"/>
    <text x="18" y="26" fill="#60a5fa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="0.5">TIER 1: PRESENTATION &amp; CLIENT INTERFACES</text>

    <!-- Component 1: CLI Console -->
    <rect x="18" y="34" width="380" height="30" rx="5" fill="#1e293b" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.4"/>
    <circle cx="34" cy="49" r="4" fill="#38bdf8"/>
    <text x="46" y="53" fill="#f1f5f9" font-family="monospace" font-size="11">Interactive Terminal CLI (Scanner / Console I/O)</text>

    <!-- Component 2: Modern Web GUI -->
    <rect x="420" y="34" width="400" height="30" rx="5" fill="#1e293b" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.4"/>
    <circle cx="436" cy="49" r="4" fill="#60a5fa"/>
    <text x="448" y="53" fill="#f1f5f9" font-family="monospace" font-size="11">Web Dashboard (HTML5 / Vanilla CSS / Modern JS)</text>
  </g>

  <!-- Arrow down 1 -->
  <path d="M 460 166 L 460 182" stroke="#475569" stroke-width="2" stroke-dasharray="3,3"/>
  <polygon points="457,180 460,186 463,180" fill="#475569"/>

  <!-- ==================================================================== -->
  <!-- TIER 2: SERVICE & CONTROLLER LAYER -->
  <!-- ==================================================================== -->
  <g transform="translate(40, 188)">
    <rect width="840" height="74" rx="8" fill="url(#layerGrad)" stroke="#334155" stroke-width="1"/>
    <rect width="840" height="6" rx="3" fill="url(#headerGrad2)"/>
    <text x="18" y="26" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="0.5">TIER 2: SERVERS, CONTROLLERS &amp; ANALYTICS</text>

    <!-- Component 1: Main.java Controller -->
    <rect x="18" y="34" width="250" height="30" rx="5" fill="#1e293b" stroke="#10b981" stroke-width="1" stroke-opacity="0.4"/>
    <text x="30" y="53" fill="#f1f5f9" font-family="monospace" font-size="11">Main.java (Menu Controller)</text>

    <!-- Component 2: BankServer.java -->
    <rect x="282" y="34" width="270" height="30" rx="5" fill="#1e293b" stroke="#10b981" stroke-width="1" stroke-opacity="0.4"/>
    <text x="294" y="53" fill="#f1f5f9" font-family="monospace" font-size="11">BankServer.java (HttpServer)</text>

    <!-- Component 3: ScoreIQ.java -->
    <rect x="566" y="34" width="254" height="30" rx="5" fill="#1e293b" stroke="#10b981" stroke-width="1" stroke-opacity="0.4"/>
    <text x="578" y="53" fill="#34d399" font-family="monospace" font-size="11">ScoreIQ.java &amp; Gemini AI</text>
  </g>

  <!-- Arrow down 2 -->
  <path d="M 460 264 L 460 280" stroke="#475569" stroke-width="2" stroke-dasharray="3,3"/>
  <polygon points="457,278 460,284 463,278" fill="#475569"/>

  <!-- ==================================================================== -->
  <!-- TIER 3: DOMAIN ENTITIES & OOP BUSINESS LOGIC -->
  <!-- ==================================================================== -->
  <g transform="translate(40, 286)">
    <rect width="840" height="88" rx="8" fill="url(#layerGrad)" stroke="#334155" stroke-width="1"/>
    <rect width="840" height="6" rx="3" fill="url(#headerGrad3)"/>
    <text x="18" y="24" fill="#a78bfa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="0.5">TIER 3: DOMAIN MODEL &amp; INHERITANCE HIERARCHY</text>

    <!-- Row 1: Abstract Base & Derived Accounts -->
    <rect x="18" y="32" width="180" height="24" rx="4" fill="#312e81" stroke="#818cf8" stroke-width="1"/>
    <text x="28" y="48" fill="#e0e7ff" font-family="monospace" font-size="10">BankEntity (Abstract)</text>

    <text x="208" y="48" fill="#94a3b8" font-family="monospace" font-size="12">→</text>

    <rect x="228" y="32" width="180" height="24" rx="4" fill="#1e293b" stroke="#818cf8" stroke-width="1"/>
    <text x="238" y="48" fill="#f1f5f9" font-family="monospace" font-size="10">Account (Base Class)</text>

    <text x="418" y="48" fill="#94a3b8" font-family="monospace" font-size="12">→</text>

    <rect x="438" y="32" width="180" height="24" rx="4" fill="#1e293b" stroke="#a78bfa" stroke-width="1"/>
    <text x="446" y="48" fill="#f1f5f9" font-family="monospace" font-size="10">SavingsAccount (Derived)</text>

    <text x="628" y="48" fill="#94a3b8" font-family="monospace" font-size="12">→</text>

    <rect x="648" y="32" width="172" height="24" rx="4" fill="#4c1d95" stroke="#c084fc" stroke-width="1"/>
    <text x="654" y="48" fill="#f3e8ff" font-family="monospace" font-size="9.5">SeniorCitizenSavings</text>

    <!-- Row 2: Secondary Derived & Helper Classes -->
    <rect x="18" y="60" width="180" height="22" rx="4" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
    <text x="28" y="75" fill="#cbd5e1" font-family="monospace" font-size="9.5">Transaction (Entity)</text>

    <rect x="228" y="60" width="180" height="22" rx="4" fill="#1e293b" stroke="#a78bfa" stroke-width="1"/>
    <text x="236" y="75" fill="#cbd5e1" font-family="monospace" font-size="9.5">CurrentAccount (Overdraft)</text>

    <rect x="438" y="60" width="180" height="22" rx="4" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
    <text x="444" y="75" fill="#cbd5e1" font-family="monospace" font-size="9.5">Account.StatementSummary</text>

    <rect x="648" y="60" width="172" height="22" rx="4" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
    <text x="654" y="75" fill="#cbd5e1" font-family="monospace" font-size="9.5">Account.PassbookAuditor</text>
  </g>

  <!-- Arrow down 3 -->
  <path d="M 460 376 L 460 392" stroke="#475569" stroke-width="2" stroke-dasharray="3,3"/>
  <polygon points="457,390 460,396 463,390" fill="#475569"/>

  <!-- ==================================================================== -->
  <!-- TIER 4: EXCEPTION HIERARCHY & PERSISTENCE I/O -->
  <!-- ==================================================================== -->
  <g transform="translate(40, 396)">
    <rect width="840" height="66" rx="8" fill="url(#layerGrad)" stroke="#334155" stroke-width="1"/>
    <rect width="840" height="6" rx="3" fill="url(#headerGrad4)"/>
    <text x="18" y="24" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="0.5">TIER 4: CUSTOM EXCEPTION HIERARCHY &amp; FILE I/O</text>

    <!-- Exceptions -->
    <rect x="18" y="32" width="480" height="26" rx="4" fill="#1e293b" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.4"/>
    <text x="28" y="49" fill="#fde68a" font-family="monospace" font-size="10">BankException → InsufficientFunds, MinimumBalance, WithdrawalLimit, InvalidAmount</text>

    <!-- File I/O -->
    <rect x="510" y="32" width="310" height="26" rx="4" fill="#1e293b" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.4"/>
    <text x="522" y="49" fill="#fef3c7" font-family="monospace" font-size="10">FileWriter / BufferedReader (.txt &amp; .csv)</text>
  </g>
</svg>