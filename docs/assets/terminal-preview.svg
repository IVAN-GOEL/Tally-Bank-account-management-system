<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="100%" height="100%">
  <defs>
    <linearGradient id="termChrome" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d3748"/>
      <stop offset="100%" stop-color="#1a202c"/>
    </linearGradient>
  </defs>

  <!-- Shadow & Container -->
  <rect width="880" height="440" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>

  <!-- Terminal Window Titlebar -->
  <rect width="880" height="34" rx="10" fill="url(#termChrome)"/>
  <!-- Flatten bottom corners of titlebar -->
  <rect y="24" width="880" height="10" fill="url(#termChrome)"/>

  <!-- Window Controls -->
  <circle cx="20" cy="17" r="6" fill="#ff5f56" stroke="#e0443e" stroke-width="0.5"/>
  <circle cx="38" cy="17" r="6" fill="#ffbd2e" stroke="#dea123" stroke-width="0.5"/>
  <circle cx="56" cy="17" r="6" fill="#27c93f" stroke="#1aab29" stroke-width="0.5"/>

  <!-- Title Text -->
  <text x="440" y="22" text-anchor="middle" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="500">bash — ivangoel@macbook: ~/passbook — 80x24</text>

  <!-- Terminal Content -->
  <g transform="translate(24, 60)" font-family="'SF Mono', Menlo, Consolas, Monaco, monospace" font-size="12">
    <!-- Command 1 -->
    <text x="0" y="0" fill="#7ee787">ivangoel@macbook passbook % <tspan fill="#f0f6fc">./build.sh</tspan></text>
    <text x="0" y="18" fill="#8b949e">Compilation successful! Bytecode generated in bin/</text>

    <!-- Command 2 -->
    <text x="0" y="44" fill="#7ee787">ivangoel@macbook passbook % <tspan fill="#f0f6fc">java -cp bin TestPassBook</tspan></text>
    <text x="0" y="62" fill="#58a6ff">==================================================================</text>
    <text x="0" y="78" fill="#f0f6fc">          Tally Java OOP Test Suite (48 Scenarios)                </text>
    <text x="0" y="94" fill="#58a6ff">==================================================================</text>
    <text x="0" y="112" fill="#7ee787"> [PASS] <tspan fill="#c9d1d9">BankEntity polymorphic getEntityId returns account number</tspan></text>
    <text x="0" y="128" fill="#7ee787"> [PASS] <tspan fill="#c9d1d9">Multilevel subclass identifies as Senior Citizen (4.25% interest)</tspan></text>
    <text x="0" y="144" fill="#7ee787"> [PASS] <tspan fill="#c9d1d9">sumTransactionsRecursively sums transactions recursively</tspan></text>
    <text x="0" y="160" fill="#7ee787"> [PASS] <tspan fill="#c9d1d9">exportStatementToFile writes header and transactions to disk</tspan></text>
    <text x="0" y="176" fill="#3fb950" font-weight="700">Test Summary: 48 PASSED, 0 FAILED (All syllabus tests green)</text>

    <!-- Command 3 -->
    <text x="0" y="206" fill="#7ee787">ivangoel@macbook passbook % <tspan fill="#f0f6fc">java -cp bin Main</tspan></text>
    <text x="0" y="226" fill="#38bdf8">==================================================================</text>
    <text x="0" y="242" fill="#f0f6fc" font-weight="700">        Tally: Bank Account Management System (Java OOP)         </text>
    <text x="0" y="258" fill="#a5b4fc">            Featuring ScoreIQ Alternative Credit Scoring          </text>
    <text x="0" y="274" fill="#38bdf8">==================================================================</text>
    <text x="0" y="292" fill="#ffd33d">ACTIVE A/C: Asha Sharma [PB84039022] | Balance: ₹21,300.00 | Savings</text>
    <text x="0" y="310" fill="#8b949e"> 1. Open Account      4. Withdraw (Polymorphic)  7. Print Statement</text>
    <text x="0" y="326" fill="#8b949e"> 2. Switch Account    5. Transfer (Objects)      8. Export to File (I/O)</text>
    <text x="0" y="342" fill="#8b949e"> 3. Deposit (Overload)6. Month-End Settlement    9. Recursive Compound Int.</text>
    <text x="0" y="358" fill="#7ee787">10. ScoreIQ Credit   11. Review External CSV    12. Syllabus Viva Cheat Sheet</text>
  </g>
</svg>