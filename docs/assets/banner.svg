<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <pattern id="gridPattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.6"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="280" rx="16" fill="url(#bgGrad)"/>
  <rect width="900" height="280" rx="16" fill="url(#gridPattern)"/>

  <!-- Border -->
  <rect x="1" y="1" width="898" height="278" rx="15" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.8"/>

  <!-- Decorative Glow Circles -->
  <circle cx="820" cy="60" r="140" fill="#6366f1" opacity="0.12" filter="url(#glow)"/>
  <circle cx="90" cy="220" r="110" fill="#0ea5e9" opacity="0.1" filter="url(#glow)"/>

  <!-- Badge Top -->
  <g transform="translate(50, 36)">
    <rect width="250" height="26" rx="13" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4"/>
    <circle cx="14" cy="13" r="4" fill="#10b981"/>
    <text x="26" y="17" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" letter-spacing="1">COLLEGE OOP SYLLABUS CAPSTONE</text>
  </g>

  <!-- Title -->
  <text x="50" y="105" fill="url(#primaryGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5">Tally: Bank Account Management</text>

  <!-- Subtitle -->
  <text x="50" y="140" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500">Core Java OOP Curriculum Showcase &amp; ScoreIQ Alternative Credit Engine</text>

  <!-- Description paragraph -->
  <text x="50" y="170" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400">Zero-dependency pure Java banking engine with interactive CLI, web dashboard, and Google Gemini underwriting.</text>

  <!-- Feature Chips / Badges -->
  <g transform="translate(50, 205)">
    <!-- Pill 1: Pure Java -->
    <rect x="0" y="0" width="130" height="34" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="14" y="21" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Pure Java 17+</text>

    <!-- Pill 2: Complete OOP -->
    <rect x="140" y="0" width="170" height="34" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="154" y="21" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">100% OOP Syllabus</text>

    <!-- Pill 3: ScoreIQ Engine -->
    <rect x="320" y="0" width="150" height="34" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="334" y="21" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">ScoreIQ Underwriter</text>

    <!-- Pill 4: Gemini AI -->
    <rect x="480" y="0" width="145" height="34" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="494" y="21" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Google Gemini AI</text>

    <!-- Pill 5: Dual Interface -->
    <rect x="635" y="0" width="145" height="34" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="649" y="21" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">CLI &amp; Web Dashboard</text>
  </g>

  <!-- Right Decorative Icon / Card -->
  <g transform="translate(730, 45)">
    <rect width="120" height="135" rx="12" fill="#1e293b" fill-opacity="0.7" stroke="#3b82f6" stroke-width="1.5" stroke-opacity="0.4"/>
    <circle cx="60" cy="45" r="24" fill="#3b82f6" fill-opacity="0.15"/>
    <path d="M 60 30 L 72 38 L 72 42 L 48 42 L 48 38 Z M 51 45 L 53 58 L 51 58 Z M 59 45 L 61 58 L 59 58 Z M 67 45 L 69 58 L 67 58 Z M 46 60 L 74 60 L 74 63 L 46 63 Z" fill="#60a5fa"/>
    <text x="60" y="92" text-anchor="middle" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">TALLY CORE</text>
    <text x="60" y="108" text-anchor="middle" fill="#10b981" font-family="monospace" font-size="10" font-weight="600">48 / 48 TESTS</text>
    <rect x="25" y="118" width="70" height="6" rx="3" fill="#10b981"/>
  </g>
</svg>